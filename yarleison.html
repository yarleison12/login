<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100" background-color: blue>

  <div class="container" style="max-width: 420px;">
    
    <!-- LOGIN FORM -->
    <div id="loginForm">
      <h3 class="text-center mb-4">Iniciar Sesión</h3>
      <form onsubmit="login(event)">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" id="loginUsuario" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
      <div class="mt-3 text-center">
        <a href="#" onclick="mostrarFormulario('registroForm')">¿No tienes usuario? Créalo</a><br>
        <a href="#" onclick="mostrarFormulario('recuperarForm')">¿Olvidaste tu contraseña?</a>
      </div>
    </div>

    <!-- REGISTRO FORM -->
    <div id="registroForm" class="d-none">
      <h3 class="text-center mb-4">Registro</h3>
      <form onsubmit="registrar(event)">
        <div class="mb-2">
          <label class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="regNombre" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Número de teléfono</label>
          <input type="tel" class="form-control" id="regTelefono" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Número de cédula</label>
          <input type="text" class="form-control" id="regCedula" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="regCorreo" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" id="regUsuario" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="regPassword" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Registrarse</button>
      </form>
      <div class="mt-3 text-center">
        <a href="#" onclick="mostrarFormulario('loginForm')">¿Ya tienes cuenta? Inicia sesión</a>
      </div>
    </div>

    <!-- RECUPERAR CONTRASEÑA FORM -->
    <div id="recuperarForm" class="d-none">
      <h3 class="text-center mb-4">Recuperar Contraseña</h3>
      <form onsubmit="recuperar(event)">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="recCorreo" required>
        </div>
        <button type="submit" class="btn btn-warning w-100">Enviar enlace</button>
      </form>
      <div class="mt-3 text-center">
        <a href="#" onclick="mostrarFormulario('loginForm')">Volver al inicio de sesión</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS + SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- JS Funcionalidad -->
  <script>
    function mostrarFormulario(id) {
      document.getElementById('loginForm').classList.add('d-none');
      document.getElementById('registroForm').classList.add('d-none');
      document.getElementById('recuperarForm').classList.add('d-none');
      document.getElementById(id).classList.remove('d-none');
    }

    function login(e) {
      e.preventDefault();
      const usuario = document.getElementById('loginUsuario').value;
      const pass = document.getElementById('loginPassword').value;

      // Simulación de login correcto
      if (usuario && pass) {
        Swal.fire('¡Bienvenido!', 'Has iniciado sesión correctamente.', 'success');
      } else {
        Swal.fire('Error', 'Por favor completa todos los campos.', 'error');
      }
    }

    function registrar(e) {
      e.preventDefault();
      const nombre = document.getElementById('regNombre').value;
      const telefono = document.getElementById('regTelefono').value;
      const cedula = document.getElementById('regCedula').value;
      const correo = document.getElementById('regCorreo').value;
      const usuario = document.getElementById('regUsuario').value;
      const pass = document.getElementById('regPassword').value;

      if (nombre && telefono && cedula && correo && usuario && pass) {
        Swal.fire('¡Registro exitoso!', 'Tu cuenta ha sido creada.', 'success');
        mostrarFormulario('loginForm');
      } else {
        Swal.fire('Error', 'Por favor completa todos los campos.', 'error');
      }
    }

    function recuperar(e) {
      e.preventDefault();
      const correo = document.getElementById('recCorreo').value;

      if (correo) {
        Swal.fire('¡Enviado!', 'Se ha enviado un enlace de recuperación al correo.', 'info');
        mostrarFormulario('loginForm');
      } else {
        Swal.fire('Error', 'Ingresa tu correo electrónico.', 'error');
      }
    }
  </script>
</body>
</html>
